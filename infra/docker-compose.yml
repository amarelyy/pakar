# Local PostgreSQL, the same engine as the Neon database used in production.
# Usage: copy infra/.env.example to infra/.env, set a password, then `docker compose -f infra/docker-compose.yml up -d`.
# All containers and volumes are grouped under the "pakar" project in Docker Desktop.
name: pakar

services:
  postgres:
    image: postgres:17
    container_name: pakar-postgres
    environment:
      - POSTGRES_USER=pakar
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      - POSTGRES_DB=pakar
    ports:
      - "5432:5432"
    volumes:
      - pakar-pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakar -d pakar"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pakar-pg-data:
    driver: local
