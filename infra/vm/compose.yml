# PAKAR on one machine: web (Caddy), API and video worker. The database is outside (Neon).
# Run from the repository root:  docker compose -f infra/vm/compose.yml up -d --build --wait
# Settings come from infra/vm/.env (see .env.example). Limits add up to 2 vCPU and about 3 GiB.
name: pakar-vm

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  web:
    <<: *common
    image: ${IMAGE_PREFIX:-pakar}-web:${IMAGE_TAG:-local}
    build: { context: ../.., dockerfile: src/Pakar.Web/Dockerfile }
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
      SITE_URL: ${SITE_URL:?}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ${ASSETS_DIR:?}/models:/srv/models:ro
      - ${ASSETS_DIR:?}/videos:/srv/videos:ro
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      # Caddy's local admin endpoint answers while the server runs, whatever the site address is.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpus: 0.25
    mem_limit: 192m

  api:
    <<: *common
    image: ${IMAGE_PREFIX:-pakar}-api:${IMAGE_TAG:-local}
    build: { context: ../.., dockerfile: src/Pakar.Api/Dockerfile }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DATABASE_URL: ${DATABASE_URL:?}
      Database__ApplyMigrationsOnStartup: "false"
      Jwt__Key: ${Jwt__Key:?}
      Ingest__ApiKey: ${Ingest__ApiKey:?}
      Admin__Email: ${Admin__Email:?}
      Admin__Password: ${Admin__Password:?}
      Admin__Name: ${Admin__Name:-Administrator}
      # appsettings.json lists seven localhost origins; every entry is replaced by the site address.
      Cors__Origins__0: ${SITE_URL:?}
      Cors__Origins__1: ${SITE_URL:?}
      Cors__Origins__2: ${SITE_URL:?}
      Cors__Origins__3: ${SITE_URL:?}
      Cors__Origins__4: ${SITE_URL:?}
      Cors__Origins__5: ${SITE_URL:?}
      Cors__Origins__6: ${SITE_URL:?}
    healthcheck:
      # The .NET images have no curl; bash sends the request. This also checks the database.
      test: &ready ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; head -1 <&3 | grep -q ' 200'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpus: 0.5
    mem_limit: 768m

  ai:
    <<: *common
    image: ${IMAGE_PREFIX:-pakar}-ai:${IMAGE_TAG:-local}
    build: { context: ../.., dockerfile: src/Pakar.AiInference/Dockerfile }
    environment:
      Worker__Enabled: "true"
      Worker__ApiBaseUrl: http://api:8080/
      Worker__ApiKey: ${Ingest__ApiKey:?}
      Worker__VideoRoot: /assets/videos
      Worker__SampleFps: ${WORKER_SAMPLE_FPS:-2}
      Model__Path: /assets/models/best.onnx
    volumes:
      - ${ASSETS_DIR:?}:/assets:ro
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: *ready
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    cpus: 1.25
    mem_limit: 2g

volumes:
  caddy_data:
  caddy_config:
